<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voxel Nomad: Infinite Explorer</title>
    <meta name="description" content="An action-packed Minecraft Dungeons crawler featuring iconic mechanics: Power Level scaling, cooldown-based Artifacts, tier-based Enchantments, Camp Blacksmith and Trader merchants, Emerald economy, and authentic Dungeons HUD.">
    <meta property="og:title" content="Voxel Nomad: Infinite Explorer">
    <meta property="og:description" content="An action-packed Minecraft Dungeons crawler featuring iconic mechanics: Power Level scaling, cooldown-based Artifacts, tier-based Enchantments, Camp Blacksmith and Trader merchants, Emerald economy, and authentic Dungeons HUD.">
    <meta name="theme-color" content="#5C9E57">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CozyWorld">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="shortcut icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            touch-action: none;
            image-rendering: pixelated; /* Essential for the MC look */
        }
        canvas {
            display: block;
            outline: none;
        }
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* Minecraft-style Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #222; 
        }
        ::-webkit-scrollbar-thumb {
            background: #888; 
            border: 2px solid #222;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #aaa; 
        }

        /* Minecraft Button Class */
        .mc-btn {
            background-color: #7f7f7f;
            border-top: 2px solid #ddd;
            border-left: 2px solid #ddd;
            border-bottom: 2px solid #222;
            border-right: 2px solid #222;
            color: white;
            text-shadow: 2px 2px 0px #000;
            transition: none;
        }
        .mc-btn:active {
            border-top: 2px solid #222;
            border-left: 2px solid #222;
            border-bottom: 2px solid #ddd;
            border-right: 2px solid #ddd;
            background-color: #555;
        }
        .mc-panel {
            background-color: #c6c6c6;
            border: 2px solid #000;
            box-shadow: inset 2px 2px 0px #fff, inset -2px -2px 0px #555;
        }
        .mc-input {
            background-color: #000;
            border: 2px solid #555;
            color: white;
            font-family: 'VT323', monospace;
        }
    </style>
<script type="importmap">

  }
}
