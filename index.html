<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft Dungeons: Voxel Explorer</title>
    <meta name="description" content="An action-packed Minecraft Dungeons crawler featuring iconic mechanics: Power Level scaling, cooldown-based Artifacts, tier-based Enchantments, Camp Blacksmith and Trader merchants, Emerald economy, and authentic Dungeons HUD.">
    <meta property="og:title" content="Minecraft Dungeons: Voxel Explorer">
    <meta property="og:description" content="An action-packed Minecraft Dungeons crawler featuring iconic mechanics: Power Level scaling, cooldown-based Artifacts, tier-based Enchantments, Camp Blacksmith and Trader merchants, Emerald economy, and authentic Dungeons HUD.">
    <meta name="theme-color" content="#5C9E57">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MCDungeons">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="shortcut icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            touch-action: none;
            image-rendering: pixelated; /* Essential for the MC look */
        }
        canvas {
            display: block;
            outline: none;
        }
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* Minecraft-style Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #222; 
        }
        ::-webkit-scrollbar-thumb {
            background: #888; 
            border: 2px solid #222;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #aaa; 
        }

        /* Minecraft UI Design System */
        .mc-btn {
            background-color: #7f7f7f;
            border-top: 2px solid #ddd;
            border-left: 2px solid #ddd;
            border-bottom: 2px solid #222;
            border-right: 2px solid #222;
            color: white;
            text-shadow: 2px 2px 0px #000;
            font-family: 'VT323', monospace;
            transition: none;
            cursor: pointer;
        }
        .mc-btn:hover {
            background-color: #8c8c8c;
        }
        .mc-btn:active {
            border-top: 2px solid #222;
            border-left: 2px solid #222;
            border-bottom: 2px solid #ddd;
            border-right: 2px solid #ddd;
            background-color: #555;
        }
        .mc-btn-green {
            background-color: #2e7d32;
            border-top: 2px solid #81c784;
            border-left: 2px solid #81c784;
            border-bottom: 2px solid #1b5e20;
            border-right: 2px solid #1b5e20;
            color: white;
            text-shadow: 2px 2px 0px #000;
            font-family: 'VT323', monospace;
            cursor: pointer;
        }
        .mc-btn-green:hover {
            background-color: #388e3c;
        }
        .mc-btn-green:active {
            border-top: 2px solid #1b5e20;
            border-left: 2px solid #1b5e20;
            border-bottom: 2px solid #81c784;
            border-right: 2px solid #81c784;
            background-color: #1b5e20;
        }
        .mc-btn-red {
            background-color: #c62828;
            border-top: 2px solid #ef5350;
            border-left: 2px solid #ef5350;
            border-bottom: 2px solid #b71c1c;
            border-right: 2px solid #b71c1c;
            color: white;
            text-shadow: 2px 2px 0px #000;
            font-family: 'VT323', monospace;
            cursor: pointer;
        }
        .mc-btn-red:hover {
            background-color: #d32f2f;
        }
        .mc-btn-gold {
            background-color: #b45309;
            border-top: 2px solid #fde047;
            border-left: 2px solid #fde047;
            border-bottom: 2px solid #78350f;
            border-right: 2px solid #78350f;
            color: white;
            text-shadow: 2px 2px 0px #000;
            font-family: 'VT323', monospace;
            cursor: pointer;
        }
        .mc-panel {
            background-color: #c6c6c6;
            border: 3px solid #000;
            box-shadow: inset 3px 3px 0px #ffffff, inset -3px -3px 0px #555555;
            font-family: 'VT323', monospace;
        }
        .mc-panel-dark {
            background-color: #242424;
            border: 3px solid #000;
            box-shadow: inset 3px 3px 0px #3d3d3d, inset -3px -3px 0px #111111;
            font-family: 'VT323', monospace;
        }
        .mc-slot {
            background-color: #8b8b8b;
            border: 2px solid #373737;
            box-shadow: inset 2px 2px 0px #000000, inset -2px -2px 0px #ffffff;
        }
        .mc-slot-dark {
            background-color: #171717;
            border: 2px solid #0a0a0a;
            box-shadow: inset 2px 2px 0px #000000, inset -2px -2px 0px #333333;
        }
        .mc-slot-selected {
            border: 2px solid #facc15 !important;
            box-shadow: inset 2px 2px 0px #ca8a04, inset -2px -2px 0px #fef08a, 0 0 6px #eab308 !important;
        }
        .mc-input {
            background-color: #000;
            border: 2px solid #555;
            color: white;
            font-family: 'VT323', monospace;
        }
        .mc-text {
            font-family: 'VT323', monospace;
            text-shadow: 2px 2px 0px #000;
            letter-spacing: 0.04em;
        }
    </style>
