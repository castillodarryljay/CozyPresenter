<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3b82f6"/>
        <stop offset="60%" stop-color="#60a5fa"/>
        <stop offset="100%" stop-color="#93c5fd"/>
      </linearGradient>
      <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#65a30d"/>
        <stop offset="100%" stop-color="#4d7c0f"/>
      </linearGradient>
      <linearGradient id="dirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#854d0e"/>
        <stop offset="100%" stop-color="#713f12"/>
      </linearGradient>
    </defs>
    
    <!-- Background rounded card or full-bleed for maskable -->
    <rect width="512" height="512" rx="112.64" fill="url(#bgGrad)"/>
    
    <!-- Clouds in background -->
    <rect x="71.67999999999998" y="62.464" width="184.32000000000002" height="36.864000000000004" fill="#ffffff" opacity="0.85" rx="7.68"/>
    <rect x="279.04" y="94.72" width="161.28" height="32.25600000000001" fill="#ffffff" opacity="0.85" rx="7.68"/>
    
    <!-- Isometric 3D Voxel Grass Block -->
    <!-- Center coordinate for top vertex of cube -->
    <g transform="translate(256, 279.04)">
      <!-- Top Face (Grass) -->
      <polygon points="0,-147.45600000000002 165.888,-64.51200000000001 0,18.432000000000002 -165.888,-64.51200000000001" 
               fill="#84cc16" stroke="#4d7c0f" stroke-width="4.096"/>
      
      <!-- Grass fringe details on top -->
      <polygon points="-46.080000000000005,-92.16000000000001 46.080000000000005,-92.16000000000001 0,-55.296" fill="#a3e635"/>
      <polygon points="-115.2,-55.296 -55.296,-27.648 -92.16000000000001,-9.216000000000001" fill="#65a30d"/>

      <!-- Left Face (Dirt + Grass top) -->
      <polygon points="-165.888,-64.51200000000001 0,18.432000000000002 0,202.752 -165.888,119.808" 
               fill="#78350f" stroke="#451a03" stroke-width="4.096"/>
      
      <!-- Left side grass layer & dripping pixel hanging teeth -->
      <polygon points="-165.888,-64.51200000000001 0,18.432000000000002 0,55.296 -55.296,41.472 -82.944,69.12 -129.02400000000003,23.040000000000003 -165.888,18.432000000000002" 
               fill="#4d7c0f"/>

      <!-- Right Face (Dirt shaded + Grass top) -->
      <polygon points="0,18.432000000000002 165.888,-64.51200000000001 165.888,119.808 0,202.752" 
               fill="#542407" stroke="#331402" stroke-width="4.096"/>
      
      <!-- Right side grass layer -->
      <polygon points="0,18.432000000000002 165.888,-64.51200000000001 165.888,13.824 110.592,32.25600000000001 64.51200000000001,64.51200000000001 0,55.296" 
               fill="#3f6212"/>

      <!-- Mini Presenter / Signpost sticking out -->
      <rect x="-13.824" y="-207.36" width="27.648" height="82.944" fill="#a16207" stroke="#451a03" stroke-width="2.56"/>
      <rect x="-73.72800000000001" y="-253.44000000000003" width="147.45600000000002" height="64.51200000000001" fill="#fde047" stroke="#854d0e" stroke-width="3.072" rx="5.12"/>
      
      <!-- Sign text lines -->
      <rect x="-55.296" y="-235.008" width="110.592" height="9.216000000000001" fill="#713f12" opacity="0.8"/>
      <rect x="-46.080000000000005" y="-211.96800000000002" width="92.16000000000001" height="9.216000000000001" fill="#713f12" opacity="0.8"/>
    </g>

    <!-- Badge '3D' pill bottom-right -->
    <rect x="311.296" y="375.808" width="147.45600000000002" height="82.944" rx="23.040000000000003" fill="#15803d" stroke="#86efac" stroke-width="4.096"/>
    <text x="385.024" y="435.712" fill="#ffffff" font-family="monospace, sans-serif" font-weight="900" font-size="50.688" text-anchor="middle">3D</text>
  </svg>